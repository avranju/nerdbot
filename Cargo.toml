[package]
name = "nerdbot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
futures = "0.3"
base64 = "0.22"
url = "2"
genai = "0.6"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
serde_urlencoded = "0.7"

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
cron = "0.16"
chrono-tz = "0.9"
humantime = "2"
notify = "8"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
wiremock = "0.6"
