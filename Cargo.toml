[package]
name = "nerdbot"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net", "io-util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.6"
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream"] }
futures = "0.3.34"
base64 = "0.23.1"
url = "2.5.8"
genai = "0.6.5"
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.6"
serde_urlencoded = "0.7.1"

sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "chrono", "migrate"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
cron = "0.17.0"
chrono-tz = "0.10.4"
humantime = "2.4.0"
notify = "8.2.0"
regex = "1.13.1"
bytes = "1.12.1"
constant_time_eq = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17", "image"] }
rmcp = { version = "3.1", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3.27.0"
chrono = { version = "0.4.45", features = ["serde"] }
wiremock = "0.6.5"
